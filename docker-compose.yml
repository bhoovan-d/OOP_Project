# Production-like stack: app + PostgreSQL.   docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/itsm
      DB_USER: itsm
      DB_PASSWORD: itsm
      JWT_SECRET: change-this-to-a-long-random-secret-in-production
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
